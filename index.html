<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Stock Scan</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#0f1410; --panel:#161d17; --panel2:#1d251e;
    --line:#2a352b; --text:#eef2ea; --dim:#8ea28f;
    --in:#5fb87a; --out:#d97757; --accent:#7fc98f;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    padding:16px 18px 10px; display:flex; align-items:center; justify-content:space-between;
  }
  header h1{font-size:17px; font-weight:700; letter-spacing:.2px; margin:0;}
  header h1 span{color:var(--accent);}
  #user-chip{
    font-size:12px; color:var(--dim); background:var(--panel); border:1px solid var(--line);
    padding:6px 10px; border-radius:999px; cursor:pointer;
  }
  #welcome{
    position:fixed; inset:0; background:var(--bg); z-index:30;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  #welcome.show{display:flex;}
  #welcome .box{width:100%; max-width:360px; text-align:center;}
  #welcome h2{font-size:20px; margin-bottom:6px;}
  #welcome p{color:var(--dim); font-size:13px; margin-bottom:18px;}
  #welcome input{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:13px 14px; border-radius:12px; font-size:16px; text-align:center;
  }
  #welcome button{
    margin-top:12px; width:100%; padding:14px; border-radius:12px; border:none;
    background:var(--accent); color:#0b120c; font-weight:700; font-size:15px;
  }
  main{flex:1; padding:0 16px 16px; display:flex; flex-direction:column; gap:14px;}

  #reader-wrap{
    position:relative; border-radius:var(--radius); overflow:hidden;
    border:1px solid var(--line); background:#000; aspect-ratio:1/1;
  }
  #reader{width:100%; height:100%;}
  #reader video{object-fit:cover !important; width:100% !important; height:100% !important;}
  #scan-frame{
    position:absolute; inset:14%; border:2px solid var(--accent); border-radius:10px;
    box-shadow:0 0 0 999px rgba(0,0,0,.35); pointer-events:none;
  }
  #start-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0c110d; z-index:5;
  }
  #start-overlay button{
    padding:14px 22px; border-radius:12px; border:none; background:var(--accent);
    color:#0b120c; font-weight:700; font-size:15px;
  }
  #cam-toggle{
    position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,.55); color:#fff;
    border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:8px 12px; font-size:12px;
  }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;
  }
  #empty-state{color:var(--dim); font-size:14px; text-align:center; padding:22px 10px;}
  #empty-state b{color:var(--text); display:block; font-size:15px; margin-bottom:4px;}

  #result{display:none;}
  #result.show{display:block;}
  .p-code{font-size:11px; color:var(--dim); letter-spacing:.5px; margin-bottom:2px;}
  .p-name{font-size:19px; font-weight:700; margin-bottom:2px;}
  .p-name[data-new="1"]::after{
    content:"nouveau produit"; font-size:11px; font-weight:600; color:var(--out);
    margin-left:8px; vertical-align:middle; border:1px solid var(--out); padding:2px 6px; border-radius:6px;
  }
  #name-input{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:10px; font-size:15px; margin-top:6px; display:none;
  }
  .qty-row{display:flex; align-items:baseline; gap:8px; margin:14px 0 4px;}
  .qty-num{font-size:38px; font-weight:800;}
  .qty-label{color:var(--dim); font-size:13px;}

  .stepper{display:flex; align-items:center; gap:10px; margin-top:14px;}
  .stepper button{
    width:44px; height:44px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:20px; font-weight:700;
  }
  #delta-input{
    flex:1; text-align:center; font-size:20px; font-weight:700; background:var(--panel2);
    border:1px solid var(--line); color:var(--text); border-radius:12px; height:44px;
  }

  .actions{display:flex; gap:10px; margin-top:14px;}
  .actions button{
    flex:1; padding:14px; border-radius:12px; border:none; font-size:15px; font-weight:700; color:#0b120c;
  }
  #btn-in{background:var(--in);}
  #btn-out{background:var(--out); color:#1a0d07;}
  #status{font-size:12px; color:var(--dim); text-align:center; min-height:16px; margin-top:10px;}
</style>
</head>
<body>

<header>
  <h1>Stock<span>Scan</span></h1>
  <div id="user-chip" onclick="openWelcome(true)">⚙ réglages</div>
</header>

<main>
  <div id="reader-wrap">
    <div id="reader"></div>
    <div id="scan-frame"></div>
    <div id="start-overlay"><button onclick="userStart()">▶ Démarrer le scan</button></div>
    <button id="cam-toggle" onclick="switchCamera()">🔄 caméra</button>
  </div>

  <div class="card" id="empty-state">
    <b>Prêt à scanner</b>
    Vise un code-barres avec la caméra. La fiche produit et le stock actuel s'affichent ici.
  </div>

  <div class="card" id="result">
    <div class="p-code" id="p-code">—</div>
    <div class="p-name" id="p-name">—</div>
    <input id="name-input" placeholder="Nom du produit">

    <div class="qty-row">
      <div class="qty-num" id="p-qty">0</div>
      <div class="qty-label">en stock</div>
    </div>

    <div class="stepper">
      <button onclick="stepDelta(-1)">−</button>
      <input id="delta-input" type="number" value="1" inputmode="numeric">
      <button onclick="stepDelta(1)">+</button>
    </div>

    <div class="actions">
      <button id="btn-out" onclick="applyDelta(-1)">↓ Sortie</button>
      <button id="btn-in" onclick="applyDelta(1)">↑ Entrée</button>
    </div>
    <div id="status"></div>
  </div>
</main>

<div id="welcome">
  <div class="box">
    <h2>Qui utilise l'appli ?</h2>
    <p>Ton prénom est enregistré sur ce téléphone et ne te sera plus redemandé.</p>
    <input id="welcome-input" placeholder="Ton prénom" autocomplete="off">
    <button onclick="saveUser()">Continuer</button>
  </div>
</div>

<script>
// ⚠️ Colle ici l'URL "/exec" obtenue après déploiement du Web App (Code.gs)
const SCRIPT_URL = "COLLE_ICI_TON_URL_APPS_SCRIPT";

let USER = "";
let currentCode = null;
let currentQty = 0;
let isNew = false;
let html5Qr, cameras = [], camIndex = 0;
let audioCtx = null;

function unlockAudio(){
  try{
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}

function playBeep(){
  if (!audioCtx) return;
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1046.5;
    const t = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.15);
  }catch(e){}
  if (navigator.vibrate) navigator.vibrate(60); // no-op sur iOS, actif sur Android
}

function userStart(){
  unlockAudio();
  document.getElementById('start-overlay').style.display = 'none';
  startScanner();
}

function openWelcome(prefill){
  if (prefill) document.getElementById('welcome-input').value = USER;
  document.getElementById('welcome').classList.add('show');
}
function saveUser(){
  const val = document.getElementById('welcome-input').value.trim();
  if (!val) return;
  USER = val;
  try{ localStorage.setItem('stockscan_user', USER); }catch(e){}
  document.getElementById('user-chip').textContent = '👤 ' + USER;
  document.getElementById('welcome').classList.remove('show');
  userStart();
}

function setStatus(msg, isErr){
  const s = document.getElementById('status');
  s.textContent = msg || "";
  s.style.color = isErr ? "#d97757" : "#8ea28f";
}

function stepDelta(dir){
  const inp = document.getElementById('delta-input');
  let v = Math.max(1, (parseInt(inp.value)||1));
  inp.value = v; // le signe est géré par les boutons Entrée/Sortie
}

async function onScan(code){
  if (!SCRIPT_URL || SCRIPT_URL.indexOf("COLLE_ICI") === 0){
    setStatus("URL Apps Script non configurée dans le code (SCRIPT_URL).", true); return;
  }
  if (code === currentCode) return; // évite les doubles scans identiques en rafale
  playBeep();
  currentCode = code;
  setStatus("Recherche…");
  try{
    const res = await fetch(SCRIPT_URL + "?code=" + encodeURIComponent(code));
    const data = await res.json();
    showProduct(data);
  }catch(err){
    setStatus("Erreur réseau — vérifie l'URL dans les réglages.", true);
  }
}

function showProduct(data){
  document.getElementById('empty-state').style.display = "none";
  const result = document.getElementById('result');
  result.classList.add('show');

  document.getElementById('p-code').textContent = data.code;
  const nameEl = document.getElementById('p-name');
  const nameInput = document.getElementById('name-input');

  if (data.found){
    isNew = false;
    nameEl.textContent = data.nom || "(sans nom)";
    nameEl.removeAttribute('data-new');
    nameEl.style.display = "block";
    nameInput.style.display = "none";
    currentQty = Number(data.quantite) || 0;
  } else {
    isNew = true;
    nameEl.textContent = "Produit inconnu";
    nameEl.setAttribute('data-new','1');
    nameEl.style.display = "block";
    nameInput.style.display = "block";
    nameInput.value = "";
    currentQty = 0;
  }
  document.getElementById('p-qty').textContent = currentQty;
  setStatus("");
}

async function applyDelta(sign){
  if (!currentCode) return;
  const amount = Math.max(1, parseInt(document.getElementById('delta-input').value)||1);
  const delta = sign * amount;
  const nom = isNew ? document.getElementById('name-input').value.trim() : undefined;

  if (isNew && !nom){ setStatus("Indique un nom pour ce nouveau produit.", true); return; }

  setStatus("Envoi…");
  try{
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ code: currentCode, delta, nom, utilisateur: USER })
    });
    const data = await res.json();
    if (data.ok){
      currentQty = data.quantite;
      document.getElementById('p-qty').textContent = currentQty;
      isNew = false;
      document.getElementById('name-input').style.display = "none";
      document.querySelector('.p-name').removeAttribute('data-new');
      setStatus((delta>0?"Entrée":"Sortie") + " enregistrée ✓");
      currentCode = null; // permet de rescanner le même code juste après
    } else {
      setStatus("Erreur: " + data.error, true);
    }
  }catch(err){
    setStatus("Erreur réseau lors de l'enregistrement.", true);
  }
}

async function startScanner(){
  html5Qr = new Html5Qrcode("reader");
  try{
    cameras = await Html5Qrcode.getCameras();
    if (!cameras.length){ setStatus("Aucune caméra détectée.", true); return; }
    camIndex = cameras.findIndex(c => /back|rear|environment/i.test(c.label));
    if (camIndex < 0) camIndex = cameras.length - 1;
    await runCamera();
  }catch(err){
    setStatus("Autorise l'accès à la caméra pour scanner.", true);
  }
}

async function runCamera(){
  const config = { fps: 12, qrbox: { width: 240, height: 160 } };
  await html5Qr.start(cameras[camIndex].id, config, onScan, ()=>{});
  const v = document.querySelector('#reader video');
  if (v){ v.setAttribute('playsinline', 'true'); v.setAttribute('webkit-playsinline', 'true'); v.muted = true; }
}

async function switchCamera(){
  if (cameras.length < 2) return;
  await html5Qr.stop();
  camIndex = (camIndex + 1) % cameras.length;
  await runCamera();
}

window.addEventListener('load', ()=>{
  try{ USER = localStorage.getItem('stockscan_user') || ""; }catch(e){}
  if (USER){
    document.getElementById('user-chip').textContent = '👤 ' + USER;
  } else {
    openWelcome(false);
  }
});
</script>
</body>
</html>
