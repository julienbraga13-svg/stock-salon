<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Configuration viewport cruciale pour le plein écran mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Haute Précision</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Fond noir pour l'immersion */
            overflow: hidden; /* Empêche le défilement pendant le scan */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Conteneur de la caméra : remplit tout l'écran */
        #reader {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* VIDÉO : La caméra elle-même */
        #reader video {
            object-fit: cover; /* S'assure que la vidéo remplit l'écran sans déformation */
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ZONE DE VISIBILITÉ (Le masque/viseur) */
        /* C'est ici que nous définissons la zone active du 1/3 haut */
        .scan-region-highlight {
            position: absolute;
            /* Positionnement dans le 1/3 haut */
            top: 10%; 
            left: 10%;
            width: 80%;
            /* Hauteur réduite (environ le 1/4 de l'écran pour un effet "barrette") */
            height: 20vh; 
            
            border: 3px solid #00FF00; /* Viseur vert vif */
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.6); /* Assombrit le reste de l'écran */
            z-index: 100;
            pointer-events: none; /* La souris passe à travers */
        }

        /* Animation de scan (ligne horizontale) */
        .scan-region-highlight::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #00FF00;
            animation: scan-line 2s infinite linear;
        }

        @keyframes scan-line {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* Zone de résultat flottante en bas */
        #result-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            z-index: 105;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-family: sans-serif;
        }
        #result {
            font-weight: bold;
            color: #c0392b;
            font-size: 1.2em;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <!-- Conteneur principal de la caméra -->
    <div id="reader">
        <!-- Le viseur graphique (superposé par CSS) -->
        <div class="scan-region-highlight"></div>
    </div>

    <!-- Résultat affiché par-dessus -->
    <div id="result-overlay">
        <div>Scannez un code dans la zone verte</div>
        <div id="result">En attente...</div>
    </div>

    <script>
        // Initialisation de l'objet scanner global
        const html5QrCode = new Html5Qrcode("reader");

        function onScanSuccess(decodedText, decodedResult) {
            // Arrête le scan dès qu'un code est trouvé pour éviter les doublons
            // (Optionnel : vous pouvez choisir de continuer à scanner)
            // html5QrCode.stop().catch(err => console.error("Erreur arrêt caméra", err));

            document.getElementById('result').innerText = decodedText;
            document.getElementById('result').style.color = "#27ae60";
            
            if (navigator.vibrate) navigator.vibrate(200); // Feedback utilisateur
            console.log(`Code détecté : ${decodedText}`);
        }

        function onScanFailure(error) {
            // On ignore les erreurs de détection d'image (très fréquentes en continu)
        }

        // Configuration critique pour démarrer et scanner
        const qrCodeSuccessCallback = onScanSuccess;
        
        // Configuration du moteur de scan
        const config = { 
            fps: 15, // Plus fluide pour le scan en temps réel
            // Important : On désactive l'interface par défaut pour ne pas avoir 
            // le choix de la caméra, on force le démarrage programmatique.
            usebarCodeScanAnalyserIfSupported: true,
            rememberLastUsedCamera: false // Force la demande à chaque fois
        };

        // DÉMARRAGE AUTOMATIQUE
        window.addEventListener('load', function () {
            // Demande l'accès à la caméra en mode "environnement" (arrière)
            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                qrCodeSuccessCallback,
                onScanFailure
            ).catch((err) => {
                // Gère les erreurs (caméra refusée, non disponible, etc.)
                console.error("Erreur démarrage caméra:", err);
                alert("Impossible d'accéder à la caméra arrière. Vérifiez les permissions.");
                document.getElementById('reader').innerHTML = "<h1>Erreur Camera</h1><p>" + err + "</p>";
            });
        });

        // Gère proprement la fermeture de la page
        window.addEventListener('beforeunload', function() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop();
            }
        });
    </script>

</body>
</html>
