<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Scanner de codes-barres</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background:#0b0d10; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .app { display:flex; flex-direction:column; height:100dvh; overflow:hidden; }

  /* --- Zone caméra (1/3 haut) --- */
  #scan-zone { flex:0 0 33.333dvh; height:33.333dvh; position:relative; background:#000; overflow:hidden; }
  #reader { width:100%; height:100%; }
  
  /* Forçage absolu de la vidéo pour iOS Safari */
  #reader video, #ios-video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    position: absolute;
    inset: 0;
  }

  #frame-overlay {
    position:absolute; inset:12px; border:3px solid rgba(255,255,255,.55);
    border-radius:14px; pointer-events:none; transition: border-color .15s, box-shadow .15s;
    z-index: 3;
  }
  #frame-overlay.ok { border-color:#22c55e; box-shadow:0 0 22px rgba(34,197,94,.75); }
  #start-overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; background:#0b0d10; color:#e8e8e8; text-align:center; padding:12px; z-index: 10;
  }
  #start-overlay button {
    background:#22c55e; color:#06240f; border:none; border-radius:10px; padding:12px 22px;
    font-size:16px; font-weight:600; cursor:pointer;
  }
  #err-msg { color:#f87171; font-size:13px; max-width:90%; }
  #scan-zone .badge {
    position:absolute; top:8px; right:8px; background:rgba(0,0,0,.5); color:#fff;
    font-size:11px; padding:4px 8px; border-radius:8px; z-index:5;
  }

  /* --- Historique (2/3 bas) --- */
  #history-header {
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:#14171c; color:#e8e8e8; border-top:1px solid #23262c;
  }
  #history-header h1 { font-size:14px; margin:0; font-weight:600; }
  #clear-btn { background:none; border:1px solid #3a3f47; color:#aab0bb; border-radius:8px; padding:6px 10px; font-size:12px; }
  #history { flex:1 1 auto; overflow-y:auto; background:#0f1115; padding:10px; }
  .item {
    background:#181b21; border:1px solid #23262c; border-radius:12px; padding:10px 12px; margin-bottom:8px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; animation:in .25s ease;
  }
  @keyframes in { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .item .code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; color:#f5f5f5; font-size:15px; word-break:break-all; }
  .item .meta { color:#8b93a1; font-size:11px; margin-top:2px; }
  .item .fmt { background:#1f3d2b; color:#4ade80; font-size:10px; padding:2px 7px; border-radius:6px; white-space:nowrap; }
  #empty { color:#5b6270; font-size:13px; text-align:center; padding:24px 10px; }
</style>
</head>
<body>
<div class="app">
  <div id="scan-zone">
    <div id="reader"></div>
    <div id="frame-overlay"></div>
    <div class="badge" id="count-badge">0 scan</div>
    <div id="start-overlay">
      <div style="font-size:15px;">Scanner de codes-barres</div>
      <button id="start-btn">▶ Démarrer la caméra</button>
      <div id="err-msg"></div>
    </div>
  </div>

  <div id="history-header">
    <h1>Historique</h1>
    <button id="clear-btn">Effacer</button>
  </div>
  <div id="history">
    <div id="empty">Aucun code scanné pour l'instant</div>
  </div>
</div>

<script>
const startOverlay = document.getElementById('start-overlay');
const startBtn = document.getElementById('start-btn');
const errMsg = document.getElementById('err-msg');
const frame = document.getElementById('frame-overlay');
const historyEl = document.getElementById('history');
const emptyEl = document.getElementById('empty');
const clearBtn = document.getElementById('clear-btn');
const countBadge = document.getElementById('count-badge');

let scanCount = 0;
let audioCtx = null;

function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.value = 0.15;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + 0.15);
  } catch (e) {}
}

function flashGreen() {
  frame.classList.add('ok');
  setTimeout(() => frame.classList.remove('ok'), 500);
}

function addToHistory(text, format) {
  scanCount++;
  countBadge.textContent = scanCount + ' scan' + (scanCount > 1 ? 's' : '');
  emptyEl.style.display = 'none';
  const item = document.createElement('div');
  item.className = 'item';
  const now = new Date().toLocaleTimeString('fr-FR');
  item.innerHTML = `
    <div>
      <div class="code">${text.replace(/</g,'&lt;')}</div>
      <div class="meta">${now}</div>
    </div>
    <div class="fmt">${format || ''}</div>`;
  historyEl.prepend(item);
}

clearBtn.addEventListener('click', () => {
  historyEl.innerHTML = '';
  historyEl.appendChild(emptyEl);
  emptyEl.style.display = 'block';
  scanCount = 0;
  countBadge.textContent = '0 scan';
});

const formats = [
  Html5QrcodeSupportedFormats.QR_CODE,
  Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8,
  Html5QrcodeSupportedFormats.UPC_A,
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.CODE_39
];

let html5Qr = null;

async function startScanner() {
  errMsg.textContent = '';
  
  try {
    html5Qr = new Html5Qrcode('reader', { formatsToSupport: formats, verbose: false });
    
    const config = {
      fps: 10,
      qrbox: { width: 250, height: 150 }
    };

    const onSuccess = (decodedText, result) => {
      const fmt = result?.format?.formatName || 'CODE';
      beep();
      flashGreen();
      addToHistory(decodedText, fmt);
    };
    
    const onFailure = () => {};

    // Détection explicite iOS pour contourner le bug d'affichage de la caméra arrière
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS) {
      // Sur iPhone, forcer l'utilisation de l'ID direct de la caméra arrière via getCameras()
      const cameras = await Html5Qrcode.getCameras();
      const backCamera = cameras.find(c => /back|rear|arrière|environment/i.test(c.label)) || cameras[cameras.length - 1];
      
      if (backCamera) {
        await html5Qr.start(backCamera.id, config, onSuccess, onFailure);
      } else {
        await html5Qr.start({ facingMode: "environment" }, config, onSuccess, onFailure);
      }
    } else {
      await html5Qr.start({ facingMode: "environment" }, config, onSuccess, onFailure);
    }

    startOverlay.style.display = 'none';
  } catch (err) {
    console.error(err);
    errMsg.textContent = "Erreur caméra : " + (err.message || err) + ". Vérifiez les permissions HTTPS.";
  }
}

startBtn.addEventListener('click', () => {
  if (audioCtx) audioCtx.resume().catch(()=>{});
  startScanner();
});
</script>
</body>
</html>
