<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion de Stock</title>

<style>
body{
    font-family:Arial;
    background:#f2f2f2;
    margin:0;
    text-align:center;
}
h2{
    background:#2196F3;
    color:white;
    margin:0;
    padding:15px;
}
video{
    width:95%;
    max-width:500px;
    border-radius:10px;
    margin-top:15px;
    border:3px solid #2196F3;
}
#code{
    font-size:22px;
    font-weight:bold;
    color:#2196F3;
    margin:15px;
}
table{
    width:95%;
    margin:auto;
    border-collapse:collapse;
    background:white;
}
th,td{
    border:1px solid #ccc;
    padding:10px;
}
button{
    padding:8px 15px;
    margin:2px;
}
</style>
</head>

<body>

<h2>Gestion de Stock</h2>

<video id="video" autoplay playsinline></video>

<div id="code">En attente...</div>

<table>
<thead>
<tr>
<th>Code-barres</th>
<th>Stock</th>
<th>+</th>
<th>-</th>
</tr>
</thead>
<tbody id="stock"></tbody>
</table>

<script>

const video=document.getElementById("video");
const codeAff=document.getElementById("code");

let stocks={};

async function camera(){

const stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"environment"
}
});

video.srcObject=stream;

if("BarcodeDetector" in window){

const detector=new BarcodeDetector({
formats:[
"ean_13",
"ean_8",
"code_128",
"upc_a",
"upc_e",
"qr_code"
]
});

scan(detector);

}else{

alert("BarcodeDetector non supporté.");

}

}

let dernier="";

async function scan(detector){

const codes=await detector.detect(video);

if(codes.length){

let code=codes[0].rawValue;

if(code!=dernier){

dernier=code;

codeAff.innerHTML=code;

ajouter(code);

setTimeout(()=>dernier="",1000);

}

}

requestAnimationFrame(()=>scan(detector));

}

function ajouter(code){

if(!stocks[code]){

stocks[code]=1;

}else{

stocks[code]++;

}

afficher();

}

function plus(code){

stocks[code]++;

afficher();

}

function moins(code){

if(stocks[code]>0)
stocks[code]--;

afficher();

}

function afficher(){

let html="";

for(let c in stocks){

html+=`
<tr>
<td>${c}</td>
<td>${stocks[c]}</td>
<td><button onclick="plus('${c}')">+</button></td>
<td><button onclick="moins('${c}')">-</button></td>
</tr>
`;

}

document.getElementById("stock").innerHTML=html;

}

camera();

</script>

</body>
</html>
