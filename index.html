<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion de Stock</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}
h2{
    margin:0;
    padding:15px;
    background:#1976d2;
    color:white;
    text-align:center;
}
#reader{
    width:100%;
    max-width:500px;
    margin:15px auto;
}
#last{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#1976d2;
    margin:10px;
}
table{
    width:95%;
    margin:auto;
    border-collapse:collapse;
    background:white;
}
th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}
button{
    padding:6px 12px;
}
</style>

</head>
<body>

<h2>Gestion de Stock</h2>

<div id="reader"></div>

<div id="last">
Aucun scan
</div>

<table>
<thead>
<tr>
<th>Code</th>
<th>Stock</th>
<th>+</th>
<th>-</th>
</tr>
</thead>

<tbody id="liste">
</tbody>

</table>

<script>

let stock={};

function afficher(){

let html="";

for(let code in stock){

html+=`
<tr>
<td>${code}</td>
<td>${stock[code]}</td>
<td><button onclick="stock['${code}']++;afficher()">+</button></td>
<td><button onclick="if(stock['${code}']>0)stock['${code}']--;afficher()">-</button></td>
</tr>
`;

}

document.getElementById("liste").innerHTML=html;

}

let dernier="";
let timer=0;

function onScanSuccess(code){

if(code===dernier && Date.now()-timer<1000)
return;

dernier=code;
timer=Date.now();

document.getElementById("last").innerHTML=code;

stock[code]=(stock[code]||0)+1;

afficher();

}

const scanner=new Html5QrcodeScanner(
"reader",
{
fps:10,
qrbox:{width:250,height:120},
rememberLastUsedCamera:true,
supportedScanTypes:[Html5QrcodeScanType.SCAN_TYPE_CAMERA]
},
false
);

scanner.render(onScanSuccess);

</script>

</body>
</html>
