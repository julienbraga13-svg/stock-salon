<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Scanner de codes-barres Pro</title>
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background:#0b0d10; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .app { display:flex; flex-direction:column; height:100dvh; overflow:hidden; }

  /* --- Zone caméra --- */
  #scan-zone { flex:0 0 35dvh; position:relative; background:#000; overflow:hidden; }
  
  #video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }

  #frame-overlay {
    position:absolute; inset:15px; border:2px solid rgba(255,255,255,0.4);
    border-radius:12px; pointer-events:none; transition: all 0.2s; z-index: 5;
    display: flex; align-items: center; justify-content: center;
  }
  #frame-overlay::after {
    content: ''; width: 80%; height: 2px; background: rgba(239, 68, 68, 0.6);
    box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
  }
  #frame-overlay.ok { border-color:#22c55e; background: rgba(34, 197, 94, 0.1); }
  #frame-overlay.ok::after { background: transparent; box-shadow: none; }

  #start-overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#0b0d10; z-index: 10; padding:20px; text-align:center;
  }
  #start-overlay button {
    background:#3b82f6; color:#fff; border:none; border-radius:10px; padding:14px 24px;
    font-size:16px; font-weight:600; cursor:pointer; margin-top: 15px;
  }
  #err-msg { color:#f87171; font-size:13px; margin-top:15px; max-width:90%; }
  
  .badge { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.6); color:#fff; font-size:11px; padding:4px 8px; border-radius:6px; z-index:6; backdrop-filter: blur(4px); }
  
  /* Bouton de bascule de caméra */
  #switch-cam-btn {
    position:absolute; top:8px; left:8px; background:rgba(255,255,255,0.15); color:#fff;
    border:1px solid rgba(255,255,255,0.3); font-size:12px; padding:5px 10px; border-radius:6px;
    z-index:6; cursor:pointer; display:none; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 5px;
  }
  #switch-cam-btn:active { background:rgba(255,255,255,0.3); }

  /* --- Historique --- */
  #history-header {
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:#14171c; color:#e8e8e8; border-top:1px solid #23262c;
  }
  #history-header h1 { font-size:14px; margin:0; font-weight:600; }
  #clear-btn { background:none; border:1px solid #3a3f47; color:#aab0bb; border-radius:6px; padding:6px 12px; font-size:12px; }
  #history { flex:1 1 auto; overflow-y:auto; background:#0f1115; padding:12px; }
  .item {
    background:#181b21; border:1px solid #23262c; border-radius:10px; padding:12px; margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; animation:in .2s ease;
  }
  @keyframes in { from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;} }
  .item .code { font-family: monospace; color:#fff; font-size:16px; font-weight:bold; word-break:break-all; }
  .item .meta { color:#8b93a1; font-size:11px; margin-top:4px; }
  .item .fmt { background:#1e293b; color:#94a3b8; font-size:10px; padding:3px 8px; border-radius:4px; }
  #empty { color:#5b6270; font-size:13px; text-align:center; padding:30px 10px; }
</style>
</head>
<body>
<div class="app">
  <div id="scan-zone">
    <video id="video" autoplay muted playsinline></video>
    <div id="frame-overlay"></div>
    <button id="switch-cam-btn" style="display:none;">🔄 Changer</button>
    <div class="badge" id="count-badge">0 scan</div>
    
    <div id="start-overlay">
      <div style="color:#e8e8e8; font-size:16px; font-weight:600;">Prêt à scanner</div>
      <button id="start-btn">Activer la caméra</button>
      <div id="err-msg"></div>
    </div>
  </div>

  <div id="history-header">
    <h1>Historique</h1>
    <button id="clear-btn">Effacer</button>
  </div>
  <div id="history">
    <div id="empty">En attente de scan...</div>
  </div>
</div>

<script>
const startOverlay = document.getElementById('start-overlay');
const startBtn = document.getElementById('start-btn');
const errMsg = document.getElementById('err-msg');
const frame = document.getElementById('frame-overlay');
const historyEl = document.getElementById('history');
const emptyEl = document.getElementById('empty');
const countBadge = document.getElementById('count-badge');
const switchCamBtn = document.getElementById('switch-cam-btn');

let scanCount = 0;
let audioCtx = null;
let codeReader = new ZXing.BrowserMultiFormatReader();
let lastScannedCode = null;
let lastScanTime = 0;

let videoDevices = [];
let currentDeviceIndex = 0;

function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 900; g.gain.value = 0.1;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.1);
  } catch (e) {}
}

function flashSuccess() {
  frame.classList.add('ok');
  setTimeout(() => frame.classList.remove('ok'), 400);
}

function addToHistory(text, format) {
  scanCount++;
  countBadge.textContent = scanCount + ' scan' + (scanCount > 1 ? 's' : '');
  emptyEl.style.display = 'none';
  
  const item = document.createElement('div');
  item.className = 'item';
  const time = new Date().toLocaleTimeString('fr-FR');
  
  item.innerHTML = `
    <div>
      <div class="code">${text}</div>
      <div class="meta">${time}</div>
    </div>
    <div class="fmt">${format}</div>`;
  
  historyEl.prepend(item);
}

document.getElementById('clear-btn').addEventListener('click', () => {
  historyEl.innerHTML = '';
  historyEl.appendChild(emptyEl);
  emptyEl.style.display = 'block';
  scanCount = 0;
  countBadge.textContent = '0 scan';
  lastScannedCode = null;
});

// Lance le décodage avec un ID de caméra spécifique
function startScannerWithDevice(deviceId) {
  codeReader.reset(); // Stop la caméra actuelle
  
  codeReader.decodeFromVideoDevice(deviceId, 'video', (result, err) => {
    if (result) {
      const text = result.getText();
      const format = result.getBarcodeFormat();
      const now = Date.now();
      
      if (text !== lastScannedCode || (now - lastScanTime) > 2000) {
        lastScannedCode = text;
        lastScanTime = now;
        beep(); flashSuccess();
        const formatName = ZXing.BarcodeFormat[format] || 'CODE';
        addToHistory(text, formatName);
      }
    }
  });
}

// Initialisation globale
async function initScanner() {
  errMsg.textContent = "Initialisation...";
  
  try {
    // 1. Demander l'accès à la caméra de force pour que iOS nous donne les vrais noms des objectifs
    const tempStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    tempStream.getTracks().forEach(track => track.stop()); // On coupe aussitôt, on a juste forcé la permission

    // 2. Récupérer la liste complète des objectifs
    videoDevices = await codeReader.listVideoInputDevices();
    
    if (videoDevices.length === 0) {
      throw new Error("Aucune caméra détectée");
    }

    startOverlay.style.display = 'none';

    // 3. Afficher le bouton de bascule si plus d'une caméra est dispo
    if (videoDevices.length > 1) {
      switchCamBtn.style.display = 'flex';
    }

    // 4. Essayer de trouver la caméra arrière principale par défaut
    // ZXing retourne souvent la caméra arrière en dernier, ou on peut chercher par mot-clé
    let defaultIndex = videoDevices.findIndex(d => /back|arrière|environment/i.test(d.label));
    if (defaultIndex === -1) {
        // Si les labels ne sont pas explicites, on prend la dernière (sur mobile, c'est souvent la dorsale principale)
        defaultIndex = videoDevices.length > 1 ? videoDevices.length - 1 : 0;
    }
    
    currentDeviceIndex = defaultIndex;

    // 5. Lancer le flux avec la caméra choisie
    startScannerWithDevice(videoDevices[currentDeviceIndex].deviceId);

  } catch (err) {
    console.error(err);
    startOverlay.style.display = 'flex';
    errMsg.textContent = "Erreur d'accès à la caméra. Vérifiez les autorisations du navigateur.";
  }
}

// Gestionnaire du bouton "Changer de caméra"
switchCamBtn.addEventListener('click', () => {
  if (videoDevices.length > 1) {
    // Passe à l'objectif suivant (boucle)
    currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
    startScannerWithDevice(videoDevices[currentDeviceIndex].deviceId);
  }
});

startBtn.addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  else beep(); 
  
  initScanner();
});
</script>
</body>
</html>
