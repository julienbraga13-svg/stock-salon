<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanner Codes-Barres</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body{margin:0;font-family:sans-serif;background:#111;color:#fff}
  #reader{width:100%;max-width:500px;margin:0 auto}
  #status{text-align:center;padding:10px;font-size:14px;color:#0f0}
  #last{text-align:center;font-size:22px;font-weight:bold;padding:10px;background:#222;word-break:break-all}
  #history{max-width:500px;margin:0 auto;padding:0 10px}
  .item{border-bottom:1px solid #333;padding:8px 0;display:flex;justify-content:space-between;font-size:14px}
  .item span:last-child{color:#888}
</style>
</head>
<body>
<div id="status">Initialisation caméra…</div>
<div id="reader"></div>
<div id="last">En attente…</div>
<div id="history"></div>

<script>
let lastCode = null, lastTime = 0;
const DELAY = 1000;

function beep(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.frequency.value = 1000; o.type = "square";
  g.gain.setValueAtTime(0.2, ctx.currentTime);
  o.start(); o.stop(ctx.currentTime + 0.15);
}

function onScan(code){
  const now = Date.now();
  if (code === lastCode && (now - lastTime) < DELAY) return;
  lastCode = code; lastTime = now;
  beep();
  document.getElementById("last").textContent = code;
  const row = document.createElement("div");
  row.className = "item";
  const t = new Date().toLocaleTimeString();
  row.innerHTML = `<span>${code}</span><span>${t}</span>`;
  document.getElementById("history").prepend(row);
}

const html5QrCode = new Html5Qrcode("reader");
const config = { fps: 10, qrbox: { width: 280, height: 150 }, aspectRatio: 1.7 };

html5QrCode.start(
  { facingMode: "environment" },
  config,
  (decodedText) => onScan(decodedText),
  () => {}
).then(() => {
  document.getElementById("status").textContent = "Caméra active — scannez un code";
}).catch(err => {
  document.getElementById("status").textContent = "Erreur caméra: " + err;
});
</script>
</body>
</html>
